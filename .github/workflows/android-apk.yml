name: Android APK

# Builds the Vera Android app (Expo, in ./mobile) into an installable APK.
#  - every push / PR that touches the app: checks + a downloadable APK artifact
#  - tag v*  (e.g. v3.0.0): also publishes the APK on a GitHub Release
#  - "Run workflow" button: choose which CPU architectures to include
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["mobile/**", "shared/**", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["mobile/**", "shared/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
    inputs:
      abis:
        description: "CPU architectures to build"
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a                                  # almost every phone made since ~2017 (smallest, fastest)
          - arm64-v8a,armeabi-v7a                      # plus older 32-bit phones
          - armeabi-v7a,arm64-v8a,x86,x86_64           # universal, also emulators (largest)

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  apk:
    name: Build APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # only used to attach the APK to a release on v* tags
    env:
      CI: "1"
      ABIS: ${{ inputs.abis || 'arm64-v8a' }}
      # Used by app.config.ts so each build has a higher versionCode than the last and installs over it.
      VERA_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs the Android SDK command-line tools and accepts licences so Gradle can fetch the platform it needs.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - run: npm ci

      # Generates the native android/ project from app.config.ts (it is not checked in).
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      # Optional: sign with your own key. Without these secrets the APK is signed with the debug key:
      # it installs fine, but you should not publish it to a store.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vera-release.keystore"
            {
              echo "VERA_KEYSTORE_PATH=$RUNNER_TEMP/vera-release.keystore"
              echo "VERA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "VERA_KEY_ALIAS=$KEY_ALIAS"
              echo "VERA_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Signing with the release keystore."
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key."
          fi

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures="$ABIS" -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LABEL=$(echo "$ABIS" | tr ',' '+')
          OUT="vera-${VERSION}-${LABEL}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "file=mobile/$OUT" >> "$GITHUB_OUTPUT"
          echo "### Vera ${VERSION} (build ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: \`$OUT\` ($(du -h "$OUT" | cut -f1)), architectures: \`$ABIS\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: vera-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
