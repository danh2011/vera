name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Package release artifact
        run: |
          mkdir -p release
          cp -r dist package.json package-lock.json .env.example README.md release/
          tar -czf vera-${{ github.ref_name }}.tar.gz -C release .
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vera-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
